[package]
name = "ark-tool"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ark-common = { workspace = true }
ark-contract = { workspace = true }
ark-ports = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
# `net` is for the web_fetch SSRF guard's DNS resolution of the target host.
tokio = { workspace = true, features = ["net"] }
# URL parsing for the web_fetch tool's SSRF guard (same major as ark-http).
url = "2"
